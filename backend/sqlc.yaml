version: "2"
sql:
  - schema: "schema.sql"
    queries: "query.sql"
    engine: "postgresql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "int4"
            go_type: "int32"
          - db_type: "integer"
            go_type: "int32"
          - db_type: "pg_catalog.int4"
            go_type: "int32"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "pg_catalog.date"
            go_type: "time.Time"
          - db_type: "text"
            go_type: "string"
          - db_type: "pg_catalog.text"
            go_type: "string"
          - db_type: "varchar"
            go_type: "string"
          - db_type: "pg_catalog.varchar"
            go_type: "string"
